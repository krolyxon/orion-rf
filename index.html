<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>ORION-RF Installer</title>

        <script
                type="module"
                src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js">
        </script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

        <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: auto;
            padding: 2rem;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
        }

        #releaseNotes {
            min-height: 150px;
            max-height: 250px;
            overflow-y: auto;
            white-space: normal;
            line-height: 1.5;
        }
        </style>
    </head>
    <body>

        <h1>ORION-RF Installer</h1>

        <div class="card">
            <h2>Select Firmware Version</h2>

            <select id="versionSelect"></select>

            <div id="releaseNotes" style="
                margin-bottom:20px;
                padding:10px;
                border:1px solid #ddd;
                border-radius:8px;
                white-space:pre-wrap;
                ">
                Loading release notes...
            </div>

            <div id="installer"></div>
        </div>

        <script>
            const BASE_URL =
                "https://krolyxon.github.io/orion-rf";

            const GITHUB_OWNER = "krolyxon";
            const GITHUB_REPO = "orion-rf";

            async function loadVersions() {
                const response =
                    await fetch(`${BASE_URL}/versions.json`);

                const versions =
                    await response.json();

                const select =
                    document.getElementById("versionSelect");

                select.innerHTML = "";

                versions.forEach(version => {
                    const option =
                        document.createElement("option");

                    option.value = version;
                    option.textContent = version;

                    select.appendChild(option);
                });

                await updateVersion();
            }

            async function loadReleaseNotes(tag) {
                try {
                    const response = await fetch(
                        `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/releases/tags/${tag}`
                    );

                    if (!response.ok) {
                        throw new Error("Release not found");
                    }

                    const release = await response.json();

                    document.getElementById("releaseNotes").innerHTML = `
    <h3>${release.name || release.tag_name}</h3>
    <small>
        Released:
        ${new Date(release.published_at).toLocaleString()}
    </small>
    <hr>
    <div>
        ${marked.parse(
            release.body || "No release notes provided."
        )}
    </div>
`;                } catch (err) {
    document.getElementById("releaseNotes").innerHTML =
        "Unable to load release notes.";
                }
            }

            async function updateVersion() {
                const version =
                    document.getElementById("versionSelect").value;

                await loadReleaseNotes(version);

                const manifest = {
                    name: "ORION-RF",
                    version: version,
                    builds: [
                        {
                            chipFamily: "ESP32-S3",
                            parts: [
                                {
                                    path:
                                    `${BASE_URL}/firmware/${version}/bootloader.bin`,
                                    offset: 0
                                },
                                {
                                    path:
                                    `${BASE_URL}/firmware/${version}/partitions.bin`,
                                    offset: 32768
                                },
                                {
                                    path:
                                    `${BASE_URL}/firmware/${version}/firmware.bin`,
                                    offset: 65536
                                }
                            ]
                        }
                    ]
                };

                const blob =
                    new Blob(
                        [JSON.stringify(manifest)],
                        { type: "application/json" }
                    );

                const manifestUrl =
                    URL.createObjectURL(blob);

                document.getElementById("installer").innerHTML = `
                    <esp-web-install-button
                manifest="${manifestUrl}">
                    </esp-web-install-button>
                    `;
            }

            document
                .getElementById("versionSelect")
                .addEventListener("change", updateVersion);

            loadVersions();
        </script>

    </body>
</html>
